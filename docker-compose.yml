name: nemec
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    container_name: ${NEMEC_CONTAINER_NAME:-nemec-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${NEMEC_POSTGRES_PASSWORD:?defina em .env (make setup)}
      POSTGRES_DB: nemec
      NEMEC_APP_PASSWORD: ${NEMEC_APP_PASSWORD:?defina em .env (make setup)}
    ports:
      - "127.0.0.1:${NEMEC_DB_PORT:-5433}:5432"
    volumes:
      - nemec_pgdata:/var/lib/postgresql/data
      - ./db:/nemec-db:ro
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nemec"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  nemec_pgdata:
