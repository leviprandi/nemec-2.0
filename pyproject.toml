[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nemec"
version = "0.1.0"
description = "Nemec 2.0 — assistente pessoal local (MVP de portfólio)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6==6.12.0",
  "ollama==0.6.3",
  "psycopg[binary]==3.3.9",
  "alembic==1.20.1",
  "pydantic==2.14.3",
  "pypdfium2==5.15.2",
]

[project.optional-dependencies]
test = [
  "pytest==9.2.0",
  "pytest-qt==4.5.0",
]

[project.scripts]
nemec = "nemec.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nemec = ["migrations/*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["real_ollama: usa o Ollama local de verdade (modelo padrão)"]
